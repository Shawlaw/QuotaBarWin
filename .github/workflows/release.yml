name: release

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run frontend and backend tests before building
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows portable zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_tests)
        run: npm run test -- --run

      - name: Test backend
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_tests)
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Build Tauri app
        run: npm run tauri -- build --no-bundle

      - name: Build CLI companion
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin quotabarwin-cli

      - name: Compute release metadata
        id: release_meta
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $versionName = $package.version
          $commitId = "${{ github.sha }}".Substring(0, 7)
          "artifact_name=quotabarwin-release($($versionName)_$commitId)" >> $env:GITHUB_OUTPUT
          "zip_name=QuotaBarWin_$($versionName)_windows_x64_portable_$commitId.zip" >> $env:GITHUB_OUTPUT

      - name: Create portable zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release -Filter *.exe -File |
            Where-Object { $_.Name -in @("QuotaBarWin.exe", "quotabarwin.exe") } |
            Select-Object -First 1
          if (-not $exe) { throw "QuotaBarWin executable was not found" }
          $cli = Get-ChildItem -Path src-tauri/target/release -Filter quotabarwin-cli.exe -File |
            Select-Object -First 1
          if (-not $cli) { throw "QuotaBarWin CLI executable was not found" }
          New-Item -ItemType Directory -Force -Path artifacts/portable | Out-Null
          Copy-Item $exe.FullName artifacts/portable/QuotaBarWin.exe
          Copy-Item $cli.FullName artifacts/portable/QuotaBarWin.Cli.exe
          Set-Content -Path artifacts/portable/quotabarwin.portable -Value "QuotaBarWin portable mode"
          Compress-Archive -Path artifacts/portable/* -DestinationPath "artifacts/${{ steps.release_meta.outputs.zip_name }}" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.release_meta.outputs.artifact_name }}
          path: artifacts/${{ steps.release_meta.outputs.zip_name }}

      - name: Upload GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ steps.release_meta.outputs.zip_name }}
