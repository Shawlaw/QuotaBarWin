name: release

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run frontend and backend tests before building
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Build Windows installer and portable zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_tests)
        run: npm run test -- --run

      - name: Test backend
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_tests)
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Create portable zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release -Filter QuotaBarWin.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "QuotaBarWin.exe was not found" }
          New-Item -ItemType Directory -Force -Path artifacts/portable | Out-Null
          Copy-Item $exe.FullName artifacts/portable/QuotaBarWin.exe
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/QuotaBarWin-portable-windows.zip -Force

      - name: Collect installer artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/installers | Out-Null
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe,*.zip,*.json |
            Copy-Item -Destination artifacts/installers -Force

      - name: Compute artifact name
        id: artifact_name
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $versionName = $package.version
          $commitId = "${{ github.sha }}".Substring(0, 7)
          "name=quotabarwin-release($($versionName)_$commitId)" >> $env:GITHUB_OUTPUT

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: artifacts/**
