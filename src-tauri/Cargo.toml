[package]
name = "quotabarwin"
default-run = "quotabarwin"
version = "1.4.2"
description = "Windows-only desktop app for monitoring AI usage and quota windows."
authors = ["QuotaBarWin Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Shawlaw/QuotaBarWin"
homepage = "https://github.com/Shawlaw/QuotaBarWin"
readme = "../README.md"

[lib]
name = "quotabarwin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Includes the local, non-networked application-update notice demo in an otherwise
# release-shaped build. This feature is intended only for internal UI previews.
update-preview = []

[[bin]]
name = "quotabarwin-cli"
path = "src/bin/quotabarwin-cli.rs"

[[bin]]
name = "quotabarwin-updater"
path = "src/bin/quotabarwin-updater.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
fs2 = "0.4"
hex = "0.4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "socks"] }
rquickjs = { version = "0.12", default-features = false, features = ["std"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-runtime = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tiny_http = "0.12"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
desktop-updater = { git = "https://github.com/Shawlaw/DeskFoundry.git", tag = "v0.1.4" }

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = "z"
