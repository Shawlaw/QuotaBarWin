[package]
name = "quotabarwin"
version = "0.0.0"
description = "QuotaBarWin"
authors = ["QuotaBarWin"]
edition = "2021"

[lib]
name = "quotabarwin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[dev-dependencies]
tempfile = "3"
