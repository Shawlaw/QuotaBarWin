[package]
name = "quotabarwin"
version = "1.0.0"
description = "Windows-first desktop app for monitoring AI usage and quota windows."
authors = ["QuotaBarWin Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Shawlaw/QuotaBarWin"
homepage = "https://github.com/Shawlaw/QuotaBarWin"
readme = "../README.md"

[lib]
name = "quotabarwin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-runtime = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = "z"
